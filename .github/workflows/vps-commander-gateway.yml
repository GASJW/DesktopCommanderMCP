name: VPS Commander Gateway Tests
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'deploy/**'
      - '.github/workflows/vps-commander-gateway.yml'
  push:
    branches:
      - 'feat/vps-commander-foundation'
    paths:
      - 'gateway/**'
      - 'deploy/**'
      - '.github/workflows/vps-commander-gateway.yml'
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check gateway/server.mjs
      - run: node --check gateway/access-auth.mjs
      - run: node --test gateway/test/*.test.mjs deploy/test/*.test.mjs
      - run: bash -n deploy/bootstrap-g3-isolation.sh