name: VPS Commander Gateway Tests
# Both checks are required by main branch protection. Do not path-filter PR
# events, otherwise docs-only PRs are permanently stuck with a missing check.
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check gateway/server.mjs
      - run: node --check gateway/access-auth.mjs
      - run: node --check gateway/audit.mjs
      - run: node --check deploy/manual-smoke-g3-audit.mjs
      - run: node --test gateway/test/*.test.mjs deploy/test/*.test.mjs
      - run: bash -n deploy/bootstrap-g3-isolation.sh
      - run: bash -n deploy/bootstrap-g3-audit.sh
      - run: bash -n deploy/bootstrap-g3-recovery.sh
      - run: bash -n deploy/verify-g3-systemd-recovery.sh
      - run: bash -n deploy/repair-g3-gateway-dependency.sh
      - run: bash -n deploy/bootstrap-g3-limits.sh
      - run: bash -n deploy/bootstrap-g3-access.sh
      - run: bash -n deploy/g5-health.sh deploy/g5-backup.sh deploy/g5-release-guard.sh
      - run: bash -n deploy/g5-offsite-encrypt.sh deploy/g5-offsite-upload.sh
      - run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('deploy/g5-restore-verify.py').read_text())"
      - run: node --check deploy/manual-smoke-g3-access.mjs
      - run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('deploy/verify-g3-recovery-events.py').read_text())"
      - run: node --check deploy/manual-smoke-g3-recovery.mjs