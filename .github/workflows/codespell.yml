# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  push:
    branches: [main]
  # Validate stacked PRs too, even when their base is another feature branch.
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          # Portuguese-language docs and UI strings are not English spelling errors.
          # Continue checking gateway backend, deployment scripts and workflows.
          skip: ./docs,./gateway/dashboard/index.html,./gateway/dashboard/app.js
